[project]
name = "dsh-browser-use-sidecar"
version = "0.5.1"
description = "The Python half of the dsh-browser-use DeepSeek Harness plugin: one browser session, observed targets, guarded execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The engine and the connection layer it drives. Both are normal dependencies here: the sidecar is a
# consumer of `jev_ultrafast`, not a part of it.
dependencies = [
    "browser-harness==0.1.13",
    "jev-ultrafast",
]

[tool.uv.sources]
# The engine ships inside this package: a wheel built from the jev-ultrafast revision named in
# vendor/jev-ultrafast.json (`bin/vendor_engine.py update <checkout>` rebuilds it and relocks). The
# plugin installs it by itself on first load (`uv sync --frozen` into its own `.venv`), so a user's
# machine needs uv and PyPI, never git or an engine checkout. To run an engine clone instead, set
# config.projectPath.
jev-ultrafast = { path = "vendor/jev_ultrafast-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar"]
