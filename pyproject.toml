[project]
name = "dsh-browser-use-sidecar"
version = "0.2.0"
description = "The Python half of the dsh-browser-use DeepSeek Harness plugin: one browser session, observed targets, guarded execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The engine and the connection layer it drives. Both are normal dependencies here: the sidecar is a
# consumer of `jev_ultrafast`, not a part of it.
dependencies = [
    "browser-harness==0.1.13",
    "jev-ultrafast",
]

[tool.uv.sources]
# A sibling checkout by default. Point this at your engine clone, or skip `uv sync` and give the
# plugin an interpreter that already imports `jev_ultrafast` (config.pythonPath).
jev-ultrafast = { path = "../jev-ultrafast", editable = true }

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar"]
