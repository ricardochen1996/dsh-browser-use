<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Jev off: every step is a full chat-model turn. Jev on: every step is one TypeSafe choice.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowFast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="520" rx="20" fill="#f8fafc"/>

  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- lane labels -->
    <text x="48" y="70" font-size="26" font-weight="800" fill="#334155">Jev off</text>
    <text x="48" y="98" font-size="15" fill="#64748b">every step is a full chat-model turn</text>
    <text x="48" y="330" font-size="26" font-weight="800" fill="#b45309">Jev on ⚡</text>
    <text x="48" y="358" font-size="15" fill="#92400e">every step is one TypeSafe choice</text>

    <!-- off lane -->
    <g font-size="16" text-anchor="middle">
      <rect x="300" y="46" width="170" height="70" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="385" y="78" font-weight="700" fill="#334155">action table</text>
      <text x="385" y="100" font-size="13" fill="#64748b">whole table into context</text>

      <rect x="530" y="30" width="320" height="102" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="690" y="66" font-weight="700" fill="#991b1b">chat model · one turn</text>
      <text x="690" y="90" font-size="13" fill="#b91c1c">system prompt + history + table → think → tool call</text>
      <text x="690" y="112" font-size="13" fill="#b91c1c">context grows every step</text>

      <rect x="910" y="46" width="170" height="70" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="995" y="78" font-weight="700" fill="#334155">browser_act</text>
      <text x="995" y="100" font-size="13" fill="#64748b">operation + target</text>

      <path d="M470 81H524" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M850 81H904" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M1080 81C1180 81 1180 180 1000 180H470C300 180 300 150 330 122" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
      <text x="740" y="205" font-size="14" fill="#64748b">× every step; latency = first token + reasoning + output</text>
    </g>

    <line x1="48" y1="250" x2="1232" y2="250" stroke="#e2e8f0" stroke-width="2"/>

    <!-- on lane -->
    <g font-size="16" text-anchor="middle">
      <rect x="300" y="306" width="170" height="70" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="385" y="338" font-weight="700" fill="#334155">action table</text>
      <text x="385" y="360" font-size="13" fill="#64748b">the same table</text>

      <rect x="530" y="306" width="320" height="70" rx="14" fill="url(#fast)" stroke="#f59e0b" stroke-width="2"/>
      <text x="690" y="338" font-weight="800" fill="#92400e">Jev (TypeSafe System One)</text>
      <text x="690" y="360" font-size="13" fill="#b45309">one request: operation + target, with probability</text>

      <rect x="910" y="306" width="170" height="70" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="995" y="338" font-weight="700" fill="#334155">browser_act</text>
      <text x="995" y="360" font-size="13" fill="#64748b">intent → runs directly</text>

      <path d="M470 341H524" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowFast)"/>
      <path d="M850 341H904" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowFast)"/>
      <path d="M1080 341C1180 341 1180 440 1000 440H470C300 440 300 410 330 382" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowFast)"/>

      <rect x="540" y="400" width="300" height="30" rx="15" fill="#ffffff" stroke="#fcd34d"/>
      <text x="690" y="420" font-size="13" fill="#92400e">text model writes the value only for TYPE_TEXT</text>
      <text x="740" y="470" font-size="14" fill="#92400e">decision loop only; outer browser_act chat round-trips are not measured</text>
    </g>
  </g>
</svg>
