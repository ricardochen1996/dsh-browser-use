name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.21.0']
    defaults:
      run:
        shell: bash
        working-directory: plugin
    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false

      - name: Read bundled engine revision
        id: engine
        run: |
          rev=$(jq -er .rev vendor/jev-ultrafast.json)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out bundled engine revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ricardochen1996/jev-ultrafast
          ref: ${{ steps.engine.outputs.rev }}
          path: jev-ultrafast
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
          python-version: '3.12'
          working-directory: plugin
          enable-cache: false

      - name: Install locked dependencies
        run: |
          npm install --global npm@11.20.0 pnpm@12.5.1
          pnpm install --frozen-lockfile --ignore-scripts
          uv sync --locked --project ../jev-ultrafast
          uv sync --locked
          google-chrome --version

      - name: Check bundled engine wheel against its revision
        run: uv run python bin/vendor_engine.py check ../jev-ultrafast

      - name: Check release versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            npm run release:check -- --tag "$REF_NAME"
          else
            npm run release:check
          fi

      - name: Lint, unit and integration checks
        run: npm run check

      - name: Real-browser sidecar checks
        run: npm run test:e2e

      - name: Check generated benchmark images
        run: |
          uv run python bench/chart.py
          git diff --exit-code -- docs/speed.en.svg docs/speed.zh-CN.svg
          git diff --exit-code -- package.json pnpm-lock.yaml pyproject.toml uv.lock

      - name: Pack and test the installable artifact
        if: matrix.node == '24.21.0'
        run: npm run release:pack

      - name: Upload verified npm artifact
        if: matrix.node == '24.21.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: |
            plugin/dist/*.tgz
            plugin/dist/pack.json
          if-no-files-found: error
          retention-days: 14
